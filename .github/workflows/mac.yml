# Gera o instalador do Investigando para Mac (.dmg) sem precisar instalar Rust ou Xcode.
# Uso: aba Actions do GitHub > "Instalador Mac" > Run workflow. O .dmg fica em Artifacts.
name: Instalador Mac
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Investigando ${{ github.ref_name }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: Investigando-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
