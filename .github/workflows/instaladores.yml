# Gera os instaladores do Investigando: Mac (.dmg) e Windows (.exe e .msi), sem instalar nada no seu computador.
# Uso: aba Actions do GitHub > "Instaladores" > Run workflow. Os arquivos ficam em Artifacts.
name: Instaladores
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sistema: Mac, os: macos-latest, args: '--target universal-apple-darwin', alvos: 'aarch64-apple-darwin,x86_64-apple-darwin', pacotes: 'src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg' }
          - { sistema: Windows, os: windows-latest, args: '', alvos: '', pacotes: "src-tauri/target/release/bundle/nsis/*.exe\nsrc-tauri/target/release/bundle/msi/*.msi" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.alvos }}' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Investigando ${{ github.ref_name }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: Investigando-${{ matrix.sistema }}
          path: ${{ matrix.pacotes }}
