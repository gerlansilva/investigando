[package]
name = "investigando"
version = "0.0.1"
description = "Investigando: ciclo investigativo com dados para o ensino fundamental"
edition = "2021"
rust-version = "1.77"

[lib]
name = "investigando_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
